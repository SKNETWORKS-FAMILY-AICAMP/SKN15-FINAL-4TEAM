version: '3.8'

services:
  # React Frontend Application
  hanssem-ui:
    build:
      context: ..
      dockerfile: docker-deployment/Dockerfile
    container_name: hanssem-interior-ui
    ports:
      - "8888:80"
    environment:
      - NODE_ENV=production
    networks:
      - hanssem-network
    restart: unless-stopped
    volumes:
      # Mount CSV data files
      - ../ui/public:/usr/share/nginx/html/public:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  hanssem-network:
    driver: bridge

