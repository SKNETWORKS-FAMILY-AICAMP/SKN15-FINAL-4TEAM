server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://frontend:80;
        try_files $uri /index.html;
    }

    location /admin/ {
        proxy_pass http://backend:8000/;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}
