version: '3.8'

services:
  # Django Backend Application
  hanssem-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanssem-interior-backend
    ports:
      - "9000:9000"
    env_file:
      - .env
    networks:
      - hanssem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  hanssem-network:
    driver: bridge
